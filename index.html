<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#020617">
  <title>Fred's Bible Reference v2.0</title>

  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#38bdf8',
              600: '#0284c7',
              700: '#0369a1',
            }
          },
          keyframes: {
            shimmer: {
              '100%': { transform: 'translateX(100%)' }
            }
          },
          animation: {
            shimmer: 'shimmer 1.8s infinite'
          }
        }
      }
    }
  </script>

  <style>
    :root { color-scheme: light dark; }
    .dark { color-scheme: dark; }

    .glass-card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 16px 40px 0 rgba(31, 38, 135, 0.08);
    }
    
    .dark .glass-card {
      background: rgba(10, 15, 30, 0.88);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 16px 40px 0 rgba(0, 0, 0, 0.65);
    }

    .glass-nav {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(229, 231, 235, 0.5);
    }

    .dark .glass-nav {
      background: rgba(2, 6, 23, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(30, 41, 59, 0.6);
    }

    /* Absolute bulletproof spacing below Dynamic Island / PWA status bar */
    .pwa-header-spacer {
      padding-top: max(3rem, calc(env(safe-area-inset-top) + 1.25rem));
    }

    .glow-bg-1 {
      position: fixed;
      top: -10%; left: -10%;
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, rgba(99, 102, 241, 0.08) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none !important;
      z-index: 0;
    }

    .glow-bg-2 {
      position: fixed;
      bottom: 5%; right: -10%;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.18) 0%, rgba(168, 85, 247, 0.08) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none !important;
      z-index: 0;
    }

    body, p, span, li, blockquote, div {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    button, input, select {
      touch-action: manipulation;
    }

    body {
      -webkit-tap-highlight-color: transparent;
    }

    select option {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 12px;
    }

    /* True Universal Root Font Controller Variables */
    :root {
      --app-font-scale: 1rem;
      --app-line-height-scale: 1.8;
    }

    /* Dynamically apply scale to all typography across every active view */
    main p, main span, main label, main h2, main h3, main h4, main div, main button, main input, main select,
    #popoverRefContent p, #popoverRefContent span {
      font-size: var(--app-font-scale);
      line-height: var(--app-line-height-scale);
    }

    /* Original gradient button format matching reference images */
    .btn-gradient-primary {
      background: linear-gradient(90deg, #38bdf8 0%, #6366f1 50%, #a855f7 100%);
      padding-top: 1.25rem;
      padding-bottom: 1.25rem;
      border-radius: 1rem;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.3);
      transition: all 0.2s ease-in-out;
    }

    .btn-gradient-primary:hover {
      opacity: 0.95;
      box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.4);
    }

    .btn-gradient-primary:active {
      transform: scale(0.98);
    }

    .skeleton-box {
      position: relative;
      overflow: hidden;
      background-color: rgba(203, 213, 225, 0.4);
    }
    .dark .skeleton-box {
      background-color: rgba(30, 41, 59, 0.6);
    }

    .skeleton-box::after {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      background-image: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0,
        rgba(255, 255, 255, 0.2) 20%,
        rgba(255, 255, 255, 0.5) 60%,
        rgba(255, 255, 255, 0)
      );
      animation: shimmer 1.8s infinite;
      content: '';
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-dvh flex flex-col font-sans transition-colors duration-300 relative selection:bg-sky-500/30">

  <div class="glow-bg-1"></div>
  <div class="glow-bg-2"></div>

  <!-- Header Bar with Universal Font Controls & Theme Toggle -->
  <header class="glass-nav sticky top-0 z-40 px-6 py-4 pwa-header-spacer flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3.5">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-500 via-indigo-500 to-purple-600 flex items-center justify-center text-white text-xs font-black shadow-md shadow-sky-500/20 select-none">
        FB
      </div>
      <div>
        <h1 class="text-base font-extrabold tracking-tight bg-gradient-to-r from-sky-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">
          Fred's Bible Reference
        </h1>
        <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">v2.0 Enterprise</span>
      </div>
    </div>

    <!-- Persistent Global Controls -->
    <div class="flex items-center gap-2.5">
      <!-- Universal Global Font Control -->
      <div class="flex items-center justify-between bg-slate-900/90 rounded-full px-3 py-1 border border-slate-800 select-none shadow-inner">
        <button id="fontDecBtn" aria-label="Decrease Font Size" class="text-xs font-black text-slate-400 hover:text-sky-400 px-1.5 py-0.5 cursor-pointer">A-</button>
        <span id="fontSizeDisplay" class="text-[11px] font-extrabold text-slate-300 px-1">100%</span>
        <button id="fontIncBtn" aria-label="Increase Font Size" class="text-xs font-black text-slate-400 hover:text-sky-400 px-1.5 py-0.5 cursor-pointer">A+</button>
      </div>

      <button id="themeToggle" aria-label="Toggle Dark/Light Theme" class="px-3.5 py-1.5 rounded-full glass-card text-xs font-semibold text-slate-700 dark:text-slate-200 shadow-sm active:scale-95 transition-all select-none cursor-pointer flex items-center gap-1.5">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </header>

  <!-- Viewport Container with Maximum Breathing Room -->
  <main id="appContainer" class="flex-1 overflow-y-auto px-5 sm:px-6 py-8 space-y-8 pb-40 z-10 max-w-4xl mx-auto w-full">
    
    <!-- READ VIEW -->
    <div id="readView" class="space-y-6">
      <div class="glass-card rounded-3xl p-6 sm:p-7 space-y-5 shadow-2xl">
        <div class="grid grid-cols-12 gap-3">
          <select id="testamentSelect" class="col-span-3 bg-slate-900 text-slate-100 rounded-2xl px-3 py-4 text-xs font-bold border border-slate-800 focus:ring-2 focus:ring-sky-500 outline-none cursor-pointer">
            <option value="NT" selected>NT</option>
            <option value="OT">OT</option>
          </select>

          <select id="bookSelect" class="col-span-5 bg-slate-900 text-slate-100 rounded-2xl px-3 py-4 text-xs font-bold border border-slate-800 focus:ring-2 focus:ring-sky-500 outline-none cursor-pointer">
          </select>

          <select id="chapterSelect" class="col-span-2 bg-slate-900 text-slate-100 rounded-xl px-2 py-4 text-xs font-bold text-center border border-slate-800 focus:ring-2 focus:ring-sky-500 outline-none cursor-pointer">
          </select>
          
          <input id="verseRangeInput" type="text" enterkeyhint="go" class="col-span-2 bg-slate-900 text-slate-100 rounded-2xl px-1 py-4 text-xs font-bold text-center border border-slate-800 focus:ring-2 focus:ring-sky-500 outline-none" placeholder="Vs..." />
        </div>

        <div>
          <select id="readTranslationSelect" class="w-full bg-slate-900 text-slate-100 rounded-2xl px-3.5 py-4 text-xs font-bold border border-slate-800 focus:ring-2 focus:ring-sky-500 outline-none cursor-pointer">
            <option value="KJV" selected>KJV - King James</option>
            <option value="ESV">ESV - English Standard</option>
            <option value="PHILLIPS">Phillips NT</option>
          </select>
        </div>

        <button id="loadBtn" class="w-full btn-gradient-primary text-xs flex items-center justify-center gap-2 select-none cursor-pointer">
          <span>📖</span> Load Passage
        </button>
      </div>

      <div id="passageHeader" class="px-3 flex justify-between items-center text-xs font-bold text-slate-300">
        <span id="passageTitle" class="text-sm font-extrabold bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">Romans 1 (KJV)</span>
        <span id="offlineStatus" class="bg-sky-500/10 text-sky-400 border border-sky-500/20 px-3 py-1 rounded-full text-[11px] font-semibold select-none">Ready</span>
      </div>

      <div id="verseDisplay" class="glass-card rounded-3xl p-6 sm:p-8 space-y-6 min-h-[400px] transition-all shadow-2xl">
        <p class="text-xs text-slate-400 text-center py-12">Tap "Load Passage" or press Enter to view text...</p>
      </div>
    </div>

    <!-- AI INSIGHTS VIEW -->
    <div id="aiView" class="space-y-6 hidden">
      <div class="glass-card rounded-3xl p-6 sm:p-7 space-y-5 shadow-2xl">
        <h2 class="text-xs font-extrabold uppercase tracking-wider text-sky-400 flex items-center gap-2 select-none">
          <span>⚙️</span> Gemini API Settings
        </h2>
        <div class="flex gap-3">
          <input id="apiKeyInput" type="password" enterkeyhint="done" placeholder="Paste Gemini API Key..." class="flex-1 bg-slate-900 text-slate-100 rounded-2xl px-4 py-4 text-xs font-mono border border-slate-800 focus:ring-2 focus:ring-sky-500 outline-none" />
          <button id="saveKeyBtn" class="bg-slate-100 text-slate-900 text-xs font-bold px-5 py-4 rounded-2xl active:scale-95 transition-all select-none cursor-pointer">
            Save Key
          </button>
        </div>
        
        <div class="flex justify-between items-center pt-1">
          <p id="keyStatusText" class="text-[11px] text-slate-400 select-none">Stored locally on device.</p>
          <button id="clearCacheBtn" class="text-[11px] font-bold text-rose-500 hover:text-rose-400 bg-rose-500/10 border border-rose-500/20 px-3.5 py-2 rounded-xl active:scale-95 transition-all cursor-pointer flex items-center gap-1.5 select-none">
            <span>🗑️</span> Clear Cache
          </button>
        </div>
      </div>

      <div class="glass-card rounded-3xl p-6 sm:p-7 space-y-5 shadow-2xl">
        <div class="flex justify-between items-center">
          <label class="text-xs font-bold text-slate-300 select-none">Target Passage</label>
          <button id="syncReaderBtn" class="text-[11px] font-bold text-sky-400 hover:text-sky-300 flex items-center gap-1 cursor-pointer">
            <span>🔄</span> Sync with Reader
          </button>
        </div>
        <input id="aiPassageInput" type="text" enterkeyhint="done" value="John 1:1-14" class="w-full bg-slate-900 text-slate-100 rounded-2xl px-4 py-4 text-xs font-bold border border-slate-800 focus:ring-2 focus:ring-sky-500 outline-none" />

        <div>
          <label class="text-[11px] font-semibold text-slate-400 select-none">Translation</label>
          <select id="aiTranslationSelect" class="w-full bg-slate-900 text-slate-100 rounded-2xl px-3.5 py-3.5 text-xs font-semibold border border-slate-800 focus:ring-2 focus:ring-sky-500 outline-none cursor-pointer mt-1">
            <option value="ESV" selected>ESV</option>
            <option value="KJV">KJV</option>
            <option value="Phillips NT">Phillips NT</option>
          </select>
        </div>

        <div class="pt-2 space-y-4">
          <div class="flex justify-between items-center border-b border-slate-800/80 pb-2">
            <label class="text-xs font-bold text-slate-300 select-none">Select Study Modules to Include:</label>
            <button id="toggleAllModulesBtn" type="button" class="text-[11px] font-bold text-sky-400 hover:text-sky-300 bg-sky-500/10 border border-sky-500/20 px-3 py-1.5 rounded-xl cursor-pointer active:scale-95 transition-all select-none">
              Check/Uncheck All
            </button>
          </div>

          <div id="modulesGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            <label class="flex items-center gap-3 bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 cursor-pointer select-none text-xs font-semibold text-slate-300 hover:border-slate-700 transition-colors">
              <input type="checkbox" data-module="overview" checked class="module-checkbox rounded border-slate-700 text-sky-500 focus:ring-sky-500 cursor-pointer w-4 h-4" />
              <span>Overview</span>
            </label>

            <label class="flex items-center gap-3 bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 cursor-pointer select-none text-xs font-semibold text-slate-300 hover:border-slate-700 transition-colors">
              <input type="checkbox" data-module="historicalContext" checked class="module-checkbox rounded border-slate-700 text-sky-500 focus:ring-sky-500 cursor-pointer w-4 h-4" />
              <span>Historical & Cultural Context</span>
            </label>

            <label class="flex items-center gap-3 bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 cursor-pointer select-none text-xs font-semibold text-slate-300 hover:border-slate-700 transition-colors">
              <input type="checkbox" data-module="keyWords" class="module-checkbox rounded border-slate-700 text-sky-500 focus:ring-sky-500 cursor-pointer w-4 h-4" />
              <span>Key Word Breakdown</span>
            </label>

            <label class="flex items-center gap-3 bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 cursor-pointer select-none text-xs font-semibold text-slate-300 hover:border-slate-700 transition-colors">
              <input type="checkbox" data-module="crossReferences" class="module-checkbox rounded border-slate-700 text-sky-500 focus:ring-sky-500 cursor-pointer w-4 h-4" />
              <span>Cross-References</span>
            </label>

            <label class="flex items-center gap-3 bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 cursor-pointer select-none text-xs font-semibold text-slate-300 hover:border-slate-700 transition-colors">
              <input type="checkbox" data-module="personalDevotional" checked class="module-checkbox rounded border-slate-700 text-sky-500 focus:ring-sky-500 cursor-pointer w-4 h-4" />
              <span>Personal Devotional</span>
            </label>

            <label class="flex items-center gap-3 bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 cursor-pointer select-none text-xs font-semibold text-slate-300 hover:border-slate-700 transition-colors">
              <input type="checkbox" data-module="teachingIllustrations" checked class="module-checkbox rounded border-slate-700 text-sky-500 focus:ring-sky-500 cursor-pointer w-4 h-4" />
              <span>Teaching Illustrations</span>
            </label>

            <label class="flex items-center gap-3 bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 cursor-pointer select-none text-xs font-semibold text-slate-300 hover:border-slate-700 transition-colors">
              <input type="checkbox" data-module="practicalActionSteps" class="module-checkbox rounded border-slate-700 text-sky-500 focus:ring-sky-500 cursor-pointer w-4 h-4" />
              <span>Practical Action Steps</span>
            </label>

            <label class="flex items-center gap-3 bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 cursor-pointer select-none text-xs font-semibold text-slate-300 hover:border-slate-700 transition-colors">
              <input type="checkbox" data-module="apologetics" class="module-checkbox rounded border-slate-700 text-sky-500 focus:ring-sky-500 cursor-pointer w-4 h-4" />
              <span>Apologetics & Hard Questions</span>
            </label>

            <label class="flex items-center gap-3 bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 cursor-pointer select-none text-xs font-semibold text-slate-300 hover:border-slate-700 transition-colors">
              <input type="checkbox" data-module="smallGroupLeader" checked class="module-checkbox rounded border-slate-700 text-sky-500 focus:ring-sky-500 cursor-pointer w-4 h-4" />
              <span>Small Group Leader Prep</span>
            </label>

            <label class="flex items-center gap-3 bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 cursor-pointer select-none text-xs font-semibold text-slate-300 hover:border-slate-700 transition-colors">
              <input type="checkbox" data-module="smallGroupIcebreakers" checked class="module-checkbox rounded border-slate-700 text-sky-500 focus:ring-sky-500 cursor-pointer w-4 h-4" />
              <span>Small Group Icebreakers</span>
            </label>

            <label class="flex items-center gap-3 bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 cursor-pointer select-none text-xs font-semibold text-slate-300 hover:border-slate-700 transition-colors">
              <input type="checkbox" data-module="smallGroupQuestions" class="module-checkbox rounded border-slate-700 text-sky-500 focus:ring-sky-500 cursor-pointer w-4 h-4" />
              <span>Small Group Questions</span>
            </label>

            <label class="flex items-center gap-3 bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 cursor-pointer select-none text-xs font-semibold text-slate-300 hover:border-slate-700 transition-colors">
              <input type="checkbox" data-module="calvinistArminian" checked class="module-checkbox rounded border-slate-700 text-sky-500 focus:ring-sky-500 cursor-pointer w-4 h-4" />
              <span>Compare Calvinist & Arminian</span>
            </label>
          </div>
        </div>

        <button id="generateAiBtn" class="w-full btn-gradient-primary text-xs flex items-center justify-center gap-2 select-none cursor-pointer">
          <span>✨</span> Generate Study & Teaching Pack
        </button>
      </div>

      <div id="aiResultsDisplay" class="glass-card rounded-3xl p-6 sm:p-8 space-y-5 shadow-2xl">
        <p class="text-xs text-slate-400 text-center py-10">Select options and tap "Generate Study & Teaching Pack".</p>
      </div>
    </div>

    <!-- CHECKBOOK TAB (LOCKED & UNTOUCHED) -->
    <div id="checkbookView" class="space-y-6 hidden">
      <div class="glass-card rounded-3xl p-6 sm:p-7 space-y-5 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-800/80 pb-3.5">
          <div>
            <span class="text-[10px] font-extrabold text-sky-400 uppercase tracking-wider">Charles H. Spurgeon</span>
            <h2 class="text-sm font-extrabold text-slate-100">Faith's Checkbook</h2>
          </div>
          <button id="checkbookTodayBtn" class="bg-sky-500/10 text-sky-400 border border-sky-500/20 px-4 py-2 rounded-xl text-xs font-bold active:scale-95 transition-all cursor-pointer">
            Today
          </button>
        </div>

        <div class="flex items-center gap-3.5">
          <label class="text-xs font-bold text-slate-400">Select Date:</label>
          <input id="checkbookDatePicker" type="date" class="flex-1 bg-slate-900 text-slate-100 rounded-2xl px-4 py-3.5 text-xs font-bold border border-slate-800 focus:ring-2 focus:ring-sky-500 outline-none" />
        </div>
      </div>

      <div id="checkbookDisplay" class="glass-card rounded-3xl p-6 sm:p-8 space-y-5 shadow-2xl">
      </div>
    </div>

  </main>

  <!-- Cross-Reference Popover Modal -->
  <div id="crossRefModal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-md flex items-center justify-center p-5 hidden">
    <div class="glass-card rounded-3xl p-6 sm:p-8 max-w-lg w-full space-y-5 relative shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3.5">
        <h3 id="popoverRefTitle" class="text-xs font-bold text-sky-400 uppercase tracking-wider">Cross-Reference Reader</h3>
        <button id="closeCrossRefModal" class="text-slate-400 hover:text-slate-100 font-extrabold text-base px-2 cursor-pointer">✕</button>
      </div>
      <div id="popoverRefContent" class="text-xs leading-relaxed max-h-80 overflow-y-auto space-y-3 py-2">
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="glass-nav fixed bottom-0 left-0 right-0 z-50 px-6 py-4 pb-9 flex justify-around items-center border-t border-slate-800/80 select-none max-w-4xl mx-auto shadow-lg">
    <button id="navReadBtn" class="flex flex-col items-center gap-1.5 text-sky-400 font-bold transition-all cursor-pointer">
      <span class="text-xl">📖</span>
      <span class="text-[10px] tracking-wide">Read</span>
    </button>
    <button id="navAiBtn" class="flex flex-col items-center gap-1.5 text-slate-400 hover:text-slate-200 font-bold transition-all cursor-pointer">
      <span class="text-xl">🤖</span>
      <span class="text-[10px] tracking-wide">AI Insights</span>
    </button>
    <button id="navCheckbookBtn" class="flex flex-col items-center gap-1.5 text-slate-400 hover:text-slate-200 font-bold transition-all cursor-pointer">
      <span class="text-xl">💳</span>
      <span class="text-[10px] tracking-wide">Checkbook</span>
    </button>
  </nav>

  <script>
    document.addEventListener('DOMContentLoaded', function() {

      // --- SAFE STORAGE HELPERS ---
      function safeGetStorage(key) {
        try { return window.localStorage.getItem(key); } catch(e) { return null; }
      }
      function safeSetStorage(key, value) {
        try { window.localStorage.setItem(key, value); } catch(e) {}
      }
      function safeRemoveStorage(key) {
        try { window.localStorage.removeItem(key); } catch(e) {}
      }

      var fontScales = [
        { size: '0.85rem', lineHeight: '1.6', pct: '85%' },
        { size: '1rem', lineHeight: '1.8', pct: '100%' },
        { size: '1.15rem', lineHeight: '1.9', pct: '115%' },
        { size: '1.3rem', lineHeight: '2.0', pct: '130%' }
      ];
      var fontScaleIndex = 1;

      function fetchPassage() {
        dismissKeyboard();
        var book = bookSelect.value || 'Romans';
        var chapter = parseInt(chapterSelect.value || '1', 10);
        var versesInput = verseRangeInput.value.trim();
        var selectedTranslation = readTranslationSelect.value || 'KJV';

        var passageQuery = versesInput ? (book + ' ' + chapter + ':' + versesInput) : (book + ' ' + chapter);
        var cacheKey = 'bcache_v3_' + selectedTranslation + '_' + book + '_' + chapter + '_' + (versesInput || 'all');

        passageTitle.textContent = passageQuery + ' (' + selectedTranslation + ')';
        var cachedData = safeGetStorage(cacheKey);

        if (cachedData) {
          try {
            var parsed = JSON.parse(cachedData);
            if (parsed && Array.isArray(parsed) && parsed.length > 0) {
              renderVerses(parsed);
              offlineStatus.textContent = selectedTranslation + ' Cached ⚡';
              offlineStatus.className = 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-[11px] font-semibold select-none';
              return;
            }
          } catch (e) { safeRemoveStorage(cacheKey); }
        }

        verseDisplay.innerHTML = renderReaderSkeleton();

        if (selectedTranslation === 'KJV') {
          fetch('https://bolls.life/get-text/KJV/' + encodeURIComponent(book) + '/' + chapter + '/')
            .then(function(res) {
              if (res.ok) {
                return res.json().then(function(data) {
                  if (data && Array.isArray(data) && data.length > 0) {
                    var formattedVerses = data.map(function(item) {
                      var cleanText = item.text.replace(/<[^>]*>?/gm, '');
                      cleanText = cleanText.replace(/([a-zA-Zä-öüÄ-ÖÜß])\d+/g, '$1');
                      return { verse: item.verse, text: cleanText };
                    });
                    
                    if (versesInput) {
                      var vNum = parseInt(versesInput, 10);
                      formattedVerses = formattedVerses.filter(function(v) { return v.verse === vNum; });
                    }

                    renderVerses(formattedVerses);
                    safeSetStorage(cacheKey, JSON.stringify(formattedVerses));
                    offlineStatus.textContent = 'KJV Active';
                    offlineStatus.className = 'bg-sky-500/10 text-sky-400 border border-sky-500/20 px-3 py-1 rounded-full text-[11px] font-semibold select-none';
                    return;
                  }
                });
              }
              throw new Error('Bolls API returned status ' + res.status);
            })
            .catch(function(err) {
              fetch('https://bible-api.com/' + encodeURIComponent(passageQuery) + '?translation=kjv')
                .then(function(res2) {
                  if (res2.ok) {
                    return res2.json().then(function(data2) {
                      if (data2 && data2.verses && data2.verses.length > 0) {
                        renderVerses(data2.verses);
                        safeSetStorage(cacheKey, JSON.stringify(data2.verses));
                        offlineStatus.textContent = 'KJV Active';
                        offlineStatus.className = 'bg-sky-500/10 text-sky-400 border border-sky-500/20 px-3 py-1 rounded-full text-[11px] font-semibold select-none';
                        return;
                      }
                    });
                  }
                  return res2.text().then(function(errorText) {
                    renderVerboseError(verseDisplay, 'Bible API (KJV) HTTP ' + res2.status, errorText);
                  });
                })
                .catch(function(e) {
                  renderVerboseError(verseDisplay, 'Bible API Network Exception', e.stack || e.message);
                });
            });
          return;
        }

        var key = getActiveApiKey();
        if (!key) {
          offlineStatus.textContent = 'Key Missing';
          offlineStatus.className = 'bg-rose-500/10 text-rose-500 border border-rose-500/20 px-3 py-1 rounded-full text-[11px] font-semibold select-none';
          verseDisplay.innerHTML = '<div class="text-center py-12 space-y-3">' +
            '<p class="text-xs text-rose-500 font-bold">Gemini API Key Required for ' + selectedTranslation + '</p>' +
            '<p class="text-[11px] text-slate-400">Save your free Gemini API Key in the AI Insights tab to render ' + selectedTranslation + ' passages.</p>' +
          '</div>';
          return;
        }

        var requestPayload = {
          contents: [{ parts: [{ text: 'Provide the complete verse text for ' + passageQuery + ' in ' + selectedTranslation + '.' }] }],
          generationConfig: { 
            temperature: 0.1, 
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT", 
              required: ["verses"],
              properties: { 
                verses: { 
                  type: "ARRAY", 
                  items: { 
                    type: "OBJECT", 
                    required: ["verse", "text"], 
                    properties: { 
                      verse: { type: "INTEGER" }, 
                      text: { type: "STRING" } 
                    } 
                  } 
                } 
              }
            }
          }
        };

        fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=' + encodeURIComponent(key), {
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify(requestPayload)
        })
        .then(function(res) {
          if (res.ok) {
            return res.json().then(function(successData) {
              var rawText = '{}';
              if (successData && successData.candidates && successData.candidates.length > 0) {
                var firstCandidate = successData.candidates[0];
                if (firstCandidate.content && firstCandidate.content.parts && firstCandidate.content.parts.length > 0) {
                  rawText = firstCandidate.content.parts[0].text || '{}';
                }
              }

              var parsed = JSON.parse(rawText);
              if (parsed && parsed.verses && parsed.verses.length > 0) {
                renderVerses(parsed.verses);
                safeSetStorage(cacheKey, JSON.stringify(parsed.verses));
                offlineStatus.textContent = selectedTranslation + ' Gemini Active';
                offlineStatus.className = 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-[11px] font-semibold select-none';
              } else {
                renderVerboseError(verseDisplay, 'Gemini Response Structure Invalid', 'Raw Response:\n' + JSON.stringify(successData, null, 2));
              }
            });
          } else {
            return res.json().catch(function() { return {}; }).then(function(errorJson) {
              var detailedMsg = errorJson.error ? JSON.stringify(errorJson.error, null, 2) : ('HTTP Status: ' + res.status);
              renderVerboseError(verseDisplay, 'Gemini API HTTP ' + res.status, detailedMsg);
            });
          }
        })
        .catch(function(e) {
          renderVerboseError(verseDisplay, 'Fetch Network Exception', e.stack || e.message);
        });
      }

      function parseLyteWordMarkdown(md, defaultTitle) {
        var cleanMd = md;
        if (md.indexOf('---') === 0) {
          var parts = md.split('---');
          if (parts.length >= 3) cleanMd = parts.slice(2).join('---').trim();
        }
        var lines = cleanMd.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
        var title = defaultTitle;
        var paragraphs = [];

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (line.indexOf('# ') === 0) {
            title = line.replace('# ', '').trim();
          } else if (line.indexOf('## ') === 0) {
            // skip titles
          } else if (line.indexOf('>') === 0 || (line.indexOf('—') !== -1 && (line.indexOf('*') === 0 || line.indexOf('"') === 0))) {
            // skip quotes
          } else if (line.indexOf('*') !== 0 && line.indexOf('---') !== 0) {
            paragraphs.push(line.replace(/\*\*/g, '').replace(/^\*|\*$/g, '').trim());
          }
        }
        return { 
          title: title, 
          paragraphs: paragraphs.length ? paragraphs : [cleanMd] 
        };
      }

          keyStatusText.textContent = "Hardcoded API Key active.";
          keyStatusText.classList.remove("text-slate-400");
          keyStatusText.classList.add("text-emerald-500");
        } else if (safeGetStorage('gemini_key')) {
          apiKeyInput.value = safeGetStorage('gemini_key');
          keyStatusText.textContent = 'Key active & stored in browser.';
          keyStatusText.classList.remove("text-slate-400");
          keyStatusText.classList.add('text-emerald-500');
        } else {
          apiKeyInput.value = "";
          keyStatusText.textContent = 'Stored locally on device.';
          keyStatusText.classList.remove("text-emerald-500");
          keyStatusText.classList.add('text-slate-400');
        }
      }

      syncKeyStatusUI();
      saveKeyBtn.addEventListener('click', function() {
        dismissKeyboard();
        if (apiKeyInput.value.trim()) { safeSetStorage('gemini_key', apiKeyInput.value.trim()); syncKeyStatusUI(); }
      });

      clearCacheBtn.addEventListener('click', function() {
        try {
          var keysToRemove = [];
          for (var i = 0; i < window.localStorage.length; i++) {
            var k = window.localStorage.key(i);
            if (k && (k.indexOf('bcache_') === 0 || k.indexOf('spcache_') === 0)) keysToRemove.push(k);
          }
          keysToRemove.forEach(function(k) { window.localStorage.removeItem(k); });
          alert('Cleared ' + keysToRemove.length + ' cached item(s).');
          loadCheckbookDevotion();
        } catch (e) { alert('Cache is already empty or access is restricted.'); }
      });

      // Generate AI Output
      function renderAiSkeletonBlock() {
        return '<div class="space-y-6 animate-fade-in">' +
          '<div class="space-y-3">' +
            '<div class="w-32 h-3.5 rounded skeleton-box"></div>' +
            '<div class="w-full h-20 rounded-2xl skeleton-box"></div>' +
          '</div>' +
        '</div>';
      }

      function isModuleSelected(moduleKey) {
        var el = document.querySelector('.module-checkbox[data-module="' + moduleKey + '"]');
        return el ? el.checked : false;
      }

      generateAiBtn.addEventListener('click', function() {
        dismissKeyboard();
        var key = getActiveApiKey();
        if (!key) {
          aiResultsDisplay.innerHTML = '<p class="text-xs text-rose-500 text-center py-10 font-bold">Please paste and save your Gemini API Key above first.</p>';
          return;
        }

        aiResultsDisplay.innerHTML = renderAiSkeletonBlock();

        var selectedModules = [];
        document.querySelectorAll('.module-checkbox:checked').forEach(function(cb) {
          selectedModules.push(cb.getAttribute('data-module'));
        });

        if (selectedModules.length === 0) {
          aiResultsDisplay.innerHTML = '<p class="text-xs text-rose-500 text-center py-10 font-bold">Please select at least one study module checkbox above.</p>';
          return;
        }

        var promptText = 'Provide a tailored biblical study & teaching output for ' + aiPassageInput.value.trim() + ' (' + aiTranslationSelect.value + ').\n';
        promptText += 'Include ONLY the following requested sections based on the requested modules:\n';

        if (isModuleSelected('overview')) promptText += '- Overview: High-level theological summary of the passage.\n';
        if (isModuleSelected('historicalContext')) promptText += '- Historical & Cultural Context: Background details on author, audience, and setting.\n';
        if (isModuleSelected('keyWords')) promptText += '- Key Word Breakdown: Significant original language words with Strong\'s IDs and meanings.\n';
        if (isModuleSelected('crossReferences')) promptText += '- Cross-References: Related biblical passage references.\n';
        if (isModuleSelected('personalDevotional')) promptText += '- Personal Devotional: Reflective application insights for personal spiritual growth.\n';
        if (isModuleSelected('teachingIllustrations')) promptText += '- Teaching Illustrations: Memorable metaphors, analogies, and illustrative real-world stories (avoid props or physical stage directions; focus purely on rich illustrative ideas).\n';
        if (isModuleSelected('practicalActionSteps')) promptText += '- Practical Action Steps: Actionable takeaways for daily life.\n';
        if (isModuleSelected('apologetics')) promptText += '- Apologetics & Hard Questions: Direct answers to difficult theological or historical objections.\n';
        if (isModuleSelected('smallGroupLeader')) promptText += '- Small Group Leader Prep: Main theme summaries and discussion goal directions.\n';
        if (isModuleSelected('smallGroupIcebreakers')) promptText += '- Small Group Icebreakers: Engaging opening icebreaker questions related to the passage theme.\n';
        if (isModuleSelected('smallGroupQuestions')) promptText += '- Small Group Questions: Thought-provoking open-ended discussion questions.\n';
        if (isModuleSelected('calvinistArminian')) promptText += '- Compare Calvinist & Arminian Perspectives: Explicit analysis comparing Calvinist vs. Arminian theological views on this passage.\n';

        var propertiesSchema = {};
        var requiredFields = [];

        if (isModuleSelected('overview')) {
          propertiesSchema.theologicalSummary = { type: "STRING" };
          requiredFields.push("theologicalSummary");
        }
        if (isModuleSelected('historicalContext')) {
          propertiesSchema.historicalContext = { type: "STRING" };
          requiredFields.push("historicalContext");
        }
        if (isModuleSelected('personalDevotional')) {
          propertiesSchema.personalDevotional = { type: "STRING" };
          requiredFields.push("personalDevotional");
        }
        if (isModuleSelected('teachingIllustrations')) {
          propertiesSchema.teachingIllustrations = { type: "STRING" };
          requiredFields.push("teachingIllustrations");
        }
        if (isModuleSelected('practicalActionSteps')) {
          propertiesSchema.practicalActionSteps = { type: "STRING" };
          requiredFields.push("practicalActionSteps");
        }
        if (isModuleSelected('apologetics')) {
          propertiesSchema.apologetics = { type: "STRING" };
          requiredFields.push("apologetics");
        }
        if (isModuleSelected('smallGroupLeader')) {
          propertiesSchema.smallGroupLeader = { type: "STRING" };
          requiredFields.push("smallGroupLeader");
        }
        if (isModuleSelected('smallGroupIcebreakers')) {
          propertiesSchema.smallGroupIcebreakers = { type: "ARRAY", items: { type: "STRING" } };
          requiredFields.push("smallGroupIcebreakers");
        }
        if (isModuleSelected('smallGroupQuestions')) {
          propertiesSchema.smallGroupQuestions = { type: "ARRAY", items: { type: "STRING" } };
          requiredFields.push("smallGroupQuestions");
        }
        if (isModuleSelected('crossReferences')) {
          propertiesSchema.crossReferences = { type: "ARRAY", items: { type: "STRING" } };
          requiredFields.push("crossReferences");
        }
        if (isModuleSelected('keyWords')) {
          propertiesSchema.keyWords = { 
            type: "ARRAY", 
            items: { 
              type: "OBJECT", 
              required: ["word", "strongs", "meaning"], 
              properties: { 
                word: { type: "STRING" }, 
                strongs: { type: "STRING" }, 
                meaning: { type: "STRING" } 
              } 
            } 
          };
          requiredFields.push("keyWords");
        }
        if (isModuleSelected('calvinistArminian')) {
          propertiesSchema.calvinismVsArminianism = { 
            type: "OBJECT", 
            required: ["calvinistView", "arminianView", "consensusOrDivergence"], 
            properties: { calvinistView: { type: "STRING" }, arminianView: { type: "STRING" }, consensusOrDivergence: { type: "STRING" } } 
          };
          requiredFields.push("calvinismVsArminianism");
        }

        fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=' + encodeURIComponent(key), {
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            contents: [{ parts: [{ text: promptText }] }], 
            generationConfig: { 
              temperature: 0.7, 
              responseMimeType: "application/json", 
              responseSchema: { 
                type: "OBJECT", 
                properties: propertiesSchema, 
                required: requiredFields 
              } 
            } 
          })
        })
        .then(function(res) {
          if (res.ok) {
            return res.json().then(function(successData) {
              var rawText = '{}';
              if (successData && successData.candidates && successData.candidates.length > 0) {
                var firstCandidate = successData.candidates[0];
                if (firstCandidate.content && firstCandidate.content.parts && firstCandidate.content.parts.length > 0) {
                  rawText = firstCandidate.content.parts[0].text || '{}';
                }
              }

              var data = JSON.parse(rawText);

              var htmlString = '<div class="space-y-5">' +
                '<div class="border-b border-slate-800/80 pb-3.5">' +
                  '<span class="text-xs font-bold text-slate-400">Target: ' + aiPassageInput.value + ' (' + aiTranslationSelect.value + ')</span>' +
                '</div>';

              if (data.theologicalSummary) {
                htmlString += '<div>' +
                  '<h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-400 mb-2 select-none">Overview</h3>' +
                  '<p class="text-xs leading-relaxed text-slate-200 bg-sky-500/10 border border-sky-500/20 p-5 rounded-2xl font-medium select-text">' + data.theologicalSummary + '</p>' +
                '</div>';
              }

              if (data.historicalContext) {
                htmlString += '<div>' +
                  '<h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-400 mb-2 select-none">🏛️ Historical & Cultural Context</h3>' +
                  '<div class="text-xs leading-relaxed text-slate-200 bg-slate-900 p-5 rounded-2xl border border-slate-800 select-text">' + data.historicalContext + '</div>' +
                '</div>';
              }

              if (data.keyWords && data.keyWords.length > 0) {
                var keywordsHtml = '';
                for(var i=0; i<data.keyWords.length; i++) {
                  var kw = data.keyWords[i];
                  keywordsHtml += '<span class="text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3.5 py-2 rounded-xl inline-block">' + kw.word + ' (' + kw.strongs + ') - <span class="font-normal italic">' + kw.meaning + '</span></span>';
                }
                htmlString += '<div><h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-400 mb-2.5 select-none">🔑 Key Word Breakdown</h3><div class="flex flex-wrap gap-2.5">' + keywordsHtml + '</div></div>';
              }

              if (data.personalDevotional) {
                htmlString += '<div>' +
                  '<h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-400 mb-2 select-none">🙏 Personal Devotional</h3>' +
                  '<div class="text-xs leading-relaxed text-slate-200 bg-slate-900 p-5 rounded-2xl border border-slate-800 select-text">' + data.personalDevotional + '</div>' +
                '</div>';
              }

              if (data.teachingIllustrations) {
                htmlString += '<div>' +
                  '<h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-400 mb-2 select-none">💡 Teaching Illustrations & Metaphors</h3>' +
                  '<div class="text-xs leading-relaxed text-slate-200 bg-slate-900 p-5 rounded-2xl border border-slate-800 select-text whitespace-pre-wrap">' + data.teachingIllustrations + '</div>' +
                '</div>';
              }

              if (data.practicalActionSteps) {
                htmlString += '<div>' +
                  '<h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-400 mb-2 select-none">🚀 Practical Action Steps</h3>' +
                  '<div class="text-xs leading-relaxed text-slate-200 bg-slate-900 p-5 rounded-2xl border border-slate-800 select-text whitespace-pre-wrap">' + data.practicalActionSteps + '</div>' +
                '</div>';
              }

              if (data.apologetics) {
                htmlString += '<div>' +
                  '<h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-400 mb-2 select-none">🛡️ Apologetics & Hard Questions</h3>' +
                  '<div class="text-xs leading-relaxed text-slate-200 bg-slate-900 p-5 rounded-2xl border border-slate-800 select-text">' + data.apologetics + '</div>' +
                '</div>';
              }

              if (data.smallGroupLeader) {
                htmlString += '<div>' +
                  '<h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-400 mb-2 select-none">👥 Small Group Leader Prep</h3>' +
                  '<div class="text-xs leading-relaxed text-slate-200 bg-slate-900 p-5 rounded-2xl border border-slate-800 select-text">' + data.smallGroupLeader + '</div>' +
                '</div>';
              }

              if (data.smallGroupIcebreakers && data.smallGroupIcebreakers.length > 0) {
                var iceHtml = '<ul class="list-disc pl-5 space-y-1.5">';
                for(var k=0; k<data.smallGroupIcebreakers.length; k++) {
                  iceHtml += '<li>' + data.smallGroupIcebreakers[k] + '</li>';
                }
                iceHtml += '</ul>';
                htmlString += '<div><h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-400 mb-2 select-none">🧊 Small Group Icebreakers</h3><div class="text-xs text-slate-200 bg-slate-900 p-5 rounded-2xl border border-slate-800 select-text">' + iceHtml + '</div></div>';
              }

              if (data.smallGroupQuestions && data.smallGroupQuestions.length > 0) {
                var qHtml = '<ol class="list-decimal pl-5 space-y-1.5">';
                for(var q=0; q<data.smallGroupQuestions.length; q++) {
                  qHtml += '<li>' + data.smallGroupQuestions[q] + '</li>';
                }
                qHtml += '</ol>';
                htmlString += '<div><h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-400 mb-2 select-none">❓ Small Group Discussion Questions</h3><div class="text-xs text-slate-200 bg-slate-900 p-5 rounded-2xl border border-slate-800 select-text">' + qHtml + '</div></div>';
              }

              if (data.calvinismVsArminianism) {
                var calvView = data.calvinismVsArminianism.calvinistView || '';
                var armView = data.calvinismVsArminianism.arminianView || '';
                var summaryView = data.calvinismVsArminianism.consensusOrDivergence || '';
                
                htmlString += '<div class="p-5 bg-indigo-950/20 border border-indigo-500/30 rounded-2xl space-y-3">' +
                  '<h3 class="text-xs font-extrabold uppercase tracking-wider text-indigo-400 select-none">⚖️ Calvinist vs. Arminian Analysis</h3>' +
                  '<div class="text-xs space-y-2.5 text-slate-200">' +
                    '<p><strong>Calvinist View:</strong> ' + calvView + '</p>' +
                    '<p><strong>Arminian View:</strong> ' + armView + '</p>' +
                    '<p class="italic text-slate-400"><strong>Summary:</strong> ' + summaryView + '</p>' +
                  '</div>' +
                '</div>';
              }

              if (data.crossReferences && data.crossReferences.length > 0) {
                var crHtml = '';
                for(var j=0; j<data.crossReferences.length; j++) {
                  crHtml += '<button class="crossref-pill text-xs font-mono bg-slate-900 text-sky-400 border border-slate-800 px-3.5 py-2 rounded-xl cursor-pointer hover:bg-slate-800">📍 ' + data.crossReferences[j] + '</button>';
                }
                htmlString += '<div><h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-400 mb-2.5 select-none">🔗 Cross-References</h3><div class="flex flex-wrap gap-2.5">' + crHtml + '</div></div>';
              }

              htmlString += '</div>';
              aiResultsDisplay.innerHTML = htmlString;
              
              var crossrefPills = document.querySelectorAll('.crossref-pill');
              crossrefPills.forEach(function(pill) {
                pill.addEventListener('click', function(e) {
                  openCrossRefPopover(e.target.textContent.replace('📍', '').trim());
                });
              });
            });
          } else {
            return res.json().catch(function() { return {}; }).then(function(errorJson) {
              var detailedMsg = errorJson.error ? JSON.stringify(errorJson.error, null, 2) : ('HTTP Status: ' + res.status);
              renderVerboseError(aiResultsDisplay, 'Gemini API HTTP ' + res.status, detailedMsg);
            });
          }
        })
        .catch(function(e) { 
          renderVerboseError(aiResultsDisplay, 'Generate Insights Error', e.stack || e.message); 
        });
      });

      // Execute Initialization
      populateBooks();
      fetchPassage();
      initCheckbookDatePicker();
      updateFontDisplay();
    });
  </script>
</body>
</html>
