<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fred's Bible">
  <title>Fred's Bible Reference</title>
  
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#38bdf8',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px) saturate(190%);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 12px 32px 0 rgba(31, 38, 135, 0.08);
    }
    
    .dark .glass-card {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(20px) saturate(190%);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.45);
    }

    .glass-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(229, 231, 235, 0.5);
    }

    .dark .glass-nav {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
    }

    .glow-bg-1 {
      position: fixed;
      top: -10%;
      left: -10%;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(99, 102, 241, 0.15) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }

    .glow-bg-2 {
      position: fixed;
      bottom: 10%;
      right: -10%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.25) 0%, rgba(168, 85, 247, 0.15) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 h-full flex flex-col font-sans transition-colors duration-300 relative overflow-hidden">

  <div class="glow-bg-1"></div>
  <div class="glow-bg-2"></div>

  <!-- Header Bar -->
  <header class="glass-nav sticky top-0 z-40 px-4 pt-12 pb-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white text-xs font-black shadow-md shadow-sky-500/20">
        FB
      </div>
      <h1 class="text-lg font-extrabold tracking-tight bg-gradient-to-r from-sky-500 via-indigo-500 to-purple-600 bg-clip-text text-transparent">
        Fred's Bible Reference
      </h1>
    </div>
    <button id="themeToggle" class="px-3 py-1.5 rounded-full glass-card text-xs font-semibold text-slate-700 dark:text-slate-200 shadow-sm active:scale-95 transition-all">
      🌙 Theme
    </button>
  </header>

  <!-- Viewport -->
  <main id="appContainer" class="flex-1 overflow-y-auto px-4 py-4 space-y-4 pb-28 z-10">
    
    <!-- READ VIEW -->
    <div id="readView" class="space-y-4">
      <div class="glass-card rounded-2xl p-4 space-y-3">
        <div class="grid grid-cols-12 gap-2">
          <!-- Testament Selector -->
          <select id="testamentSelect" class="col-span-3 bg-slate-200/80 dark:bg-slate-800/80 text-slate-900 dark:text-slate-100 rounded-xl px-2 py-2.5 text-xs font-bold border border-slate-300/40 dark:border-slate-700/40 focus:ring-2 focus:ring-sky-500 outline-none">
            <option value="NT" selected>NT</option>
            <option value="OT">OT</option>
          </select>

          <!-- Book Selector -->
          <select id="bookSelect" class="col-span-5 bg-slate-200/80 dark:bg-slate-800/80 text-slate-900 dark:text-slate-100 rounded-xl px-2 py-2.5 text-xs font-bold border border-slate-300/40 dark:border-slate-700/40 focus:ring-2 focus:ring-sky-500 outline-none">
          </select>
          
          <!-- Chapter / Verse Range Text Input -->
          <input id="passageRangeInput" type="text" value="12:9-12" class="col-span-4 bg-slate-200/80 dark:bg-slate-800/80 text-slate-900 dark:text-slate-100 rounded-xl px-2 py-2.5 text-xs font-bold text-center border border-slate-300/40 dark:border-slate-700/40 focus:ring-2 focus:ring-sky-500 outline-none" placeholder="12:9-12" />
        </div>

        <button id="loadBtn" class="w-full bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white font-bold text-xs py-2.5 rounded-xl shadow-md shadow-sky-500/20 active:scale-95 transition-all">
          Load Passage
        </button>

        <div class="relative">
          <input id="searchInput" type="text" placeholder="Search loaded text..." class="w-full bg-slate-200/50 dark:bg-slate-800/50 text-slate-900 dark:text-slate-100 rounded-xl pl-9 pr-3 py-2 text-xs font-medium border border-slate-300/40 dark:border-slate-700/40 focus:ring-2 focus:ring-sky-500 outline-none" />
          <span class="absolute left-3 top-2.5 text-xs text-slate-400">🔍</span>
        </div>
      </div>

      <div id="passageHeader" class="px-1 flex justify-between items-center text-xs font-bold text-slate-600 dark:text-slate-300">
        <span id="passageTitle" class="text-sm bg-gradient-to-r from-sky-500 to-indigo-600 bg-clip-text text-transparent">John 1 (ESV)</span>
        <span id="offlineStatus" class="bg-sky-500/10 text-sky-600 dark:text-sky-400 border border-sky-500/20 px-2.5 py-0.5 rounded-full text-[10px] font-semibold">ESV Active</span>
      </div>

      <div id="verseDisplay" class="glass-card rounded-2xl p-5 space-y-3 min-h-[320px]">
        <p class="text-xs text-slate-400 text-center py-10">Tap "Load Passage" or press Enter to view text...</p>
      </div>
    </div>

    <!-- AI INSIGHTS VIEW -->
    <div id="aiView" class="space-y-4 hidden">
      <div class="glass-card rounded-2xl p-4 space-y-3">
        <h2 class="text-xs font-extrabold uppercase tracking-wider text-sky-500 flex items-center gap-2">
          <span>⚙️</span> Gemini API Settings
        </h2>
        <div class="flex gap-2">
          <input id="apiKeyInput" type="password" placeholder="Paste Gemini API Key..." class="flex-1 bg-slate-200/80 dark:bg-slate-800/80 text-slate-900 dark:text-slate-100 rounded-xl px-3 py-2 text-xs font-mono border border-slate-300/40 dark:border-slate-700/40 focus:ring-2 focus:ring-sky-500 outline-none" />
          <button id="saveKeyBtn" class="bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-xs font-bold px-3 py-2 rounded-xl active:scale-95 transition-all">
            Save Key
          </button>
        </div>
        <p id="keyStatusText" class="text-[11px] text-slate-400">Stored locally on device.</p>
      </div>

      <div class="glass-card rounded-2xl p-4 space-y-3">
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-600 dark:text-slate-300">Target Passage</label>
          <input id="aiPassageInput" type="text" value="John 1:1-14" class="w-full bg-slate-200/80 dark:bg-slate-800/80 text-slate-900 dark:text-slate-100 rounded-xl px-3 py-2 text-xs font-bold border border-slate-300/40 dark:border-slate-700/40 focus:ring-2 focus:ring-sky-500 outline-none" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[11px] font-semibold text-slate-400">Translation</label>
            <select id="aiTranslationSelect" class="w-full bg-slate-200/80 dark:bg-slate-800/80 text-slate-900 dark:text-slate-100 rounded-xl px-2 py-2 text-xs font-semibold border border-slate-300/40 dark:border-slate-700/40 focus:ring-2 focus:ring-sky-500 outline-none">
              <option value="ESV" selected>ESV</option>
              <option value="NASB">NASB</option>
              <option value="KJV">KJV</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] font-semibold text-slate-400">Tradition / Focus</label>
            <select id="aiTraditionSelect" class="w-full bg-slate-200/80 dark:bg-slate-800/80 text-slate-900 dark:text-slate-100 rounded-xl px-2 py-2 text-xs font-semibold border border-slate-300/40 dark:border-slate-700/40 focus:ring-2 focus:ring-sky-500 outline-none">
              <option value="Expository">Expository / Cross-Ref</option>
              <option value="General Protestant">General Protestant</option>
              <option value="Reformed">Reformed</option>
              <option value="Wesleyan">Wesleyan</option>
            </select>
          </div>
        </div>

        <button id="generateAiBtn" class="w-full bg-gradient-to-r from-sky-500 via-indigo-500 to-purple-600 text-white font-bold text-xs py-3 rounded-xl shadow-lg shadow-sky-500/25 active:scale-95 transition-all flex items-center justify-center gap-2">
          <span>✨</span> Generate Study & Teaching Pack
        </button>
      </div>

      <div id="aiResultsDisplay" class="glass-card rounded-2xl p-5 space-y-4">
        <p class="text-xs text-slate-400 text-center py-8">Select a passage and tap "Generate Study & Teaching Pack".</p>
      </div>
    </div>

    <!-- LEXICON VIEW -->
    <div id="lexiconView" class="space-y-4 hidden">
      <div class="glass-card rounded-2xl p-4 space-y-3">
        <h2 class="text-xs font-extrabold uppercase tracking-wider text-sky-500 flex items-center gap-2">
          <span>🏛️</span> Greek & Hebrew Lexicon
        </h2>
        <div class="flex gap-2">
          <input id="strongsInput" type="text" placeholder="e.g. G3056 or H7225..." class="flex-1 bg-slate-200/80 dark:bg-slate-800/80 text-slate-900 dark:text-slate-100 rounded-xl px-3 py-2 text-xs font-mono border border-slate-300/40 dark:border-slate-700/40 focus:ring-2 focus:ring-sky-500 outline-none" />
          <button id="lexiconSearchBtn" class="bg-gradient-to-r from-sky-500 to-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-xl active:scale-95 transition-all">
            Lookup
          </button>
        </div>

        <div class="flex flex-wrap gap-1.5 pt-1">
          <button class="preset-tag text-[10px] font-bold bg-slate-200/80 dark:bg-slate-800/80 px-2.5 py-1 rounded-lg text-sky-600 dark:text-sky-400 border border-slate-300/40 dark:border-slate-700/40 active:scale-95" data-strongs="G3056">Logos (G3056)</button>
          <button class="preset-tag text-[10px] font-bold bg-slate-200/80 dark:bg-slate-800/80 px-2.5 py-1 rounded-lg text-sky-600 dark:text-sky-400 border border-slate-300/40 dark:border-slate-700/40 active:scale-95" data-strongs="G26">Agape (G26)</button>
          <button class="preset-tag text-[10px] font-bold bg-slate-200/80 dark:bg-slate-800/80 px-2.5 py-1 rounded-lg text-sky-600 dark:text-sky-400 border border-slate-300/40 dark:border-slate-700/40 active:scale-95" data-strongs="G4151">Pneuma (G4151)</button>
          <button class="preset-tag text-[10px] font-bold bg-slate-200/80 dark:bg-slate-800/80 px-2.5 py-1 rounded-lg text-sky-600 dark:text-sky-400 border border-slate-300/40 dark:border-slate-700/40 active:scale-95" data-strongs="H7225">Reshith (H7225)</button>
          <button class="preset-tag text-[10px] font-bold bg-slate-200/80 dark:bg-slate-800/80 px-2.5 py-1 rounded-lg text-sky-600 dark:text-sky-400 border border-slate-300/40 dark:border-slate-700/40 active:scale-95" data-strongs="H430">Elohim (H430)</button>
        </div>
      </div>

      <div id="lexiconResultCard" class="glass-card rounded-2xl p-5 space-y-4">
        <p class="text-xs text-slate-400 text-center py-8">Select a tag or search Strong's ID to load definition.</p>
      </div>
    </div>

  </main>

  <!-- Navigation -->
  <nav class="glass-nav fixed bottom-0 left-0 right-0 z-40 px-6 py-3 flex justify-around items-center border-t border-slate-200/50 dark:border-slate-800/50">
    <button id="navReadBtn" class="flex flex-col items-center gap-1 text-sky-500 font-bold transition-all">
      <span class="text-xl">📖</span>
      <span class="text-[10px] tracking-wide">Read</span>
    </button>
    <button id="navAiBtn" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 font-bold transition-all">
      <span class="text-xl">🤖</span>
      <span class="text-[10px] tracking-wide">AI Insights</span>
    </button>
    <button id="navLexiconBtn" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 font-bold transition-all">
      <span class="text-xl">🏛️</span>
      <span class="text-[10px] tracking-wide">Lexicon</span>
    </button>
  </nav>

  <script>
    const BIBLE_BOOKS = {
      OT: ["Genesis", "Exodus", "Leviticus", "Numbers", "Deuteronomy", "Joshua", "Judges", "Ruth", "1 Samuel", "2 Samuel", "1 Kings", "2 Kings", "1 Chronicles", "2 Chronicles", "Ezra", "Nehemiah", "Esther", "Job", "Psalms", "Proverbs", "Ecclesiastes", "Song of Solomon", "Isaiah", "Jeremiah", "Lamentations", "Ezekiel", "Daniel", "Hosea", "Joel", "Amos", "Obadiah", "Jonah", "Micah", "Nahum", "Habakkuk", "Zephaniah", "Haggai", "Zechariah", "Malachi"],
      NT: ["Matthew", "Mark", "Luke", "John", "Acts", "Romans", "1 Corinthians", "2 Corinthians", "Galatians", "Ephesians", "Philippians", "Colossians", "1 Thessalonians", "2 Thessalonians", "1 Timothy", "2 Timothy", "Titus", "Philemon", "Hebrews", "James", "1 Peter", "2 Peter", "1 John", "2 John", "3 John", "Jude", "Revelation"]
    };

    const LEXICON_DICT = {
      'G3056': { strongs: 'G3056', word: 'λόγος (logos)', transliteration: 'logos', language: 'Greek', partOfSpeech: 'Noun', definition: 'A word, divine expression, or reasoning.', usage: 'Used of the divine Word, Jesus Christ (John 1:1).' },
      'G26': { strongs: 'G26', word: 'ἀγάπη (agape)', transliteration: 'agape', language: 'Greek', partOfSpeech: 'Noun', definition: 'Unconditional, benevolent, self-sacrificing love.', usage: 'God’s divine love towards humanity.' },
      'G4151': { strongs: 'G4151', word: 'πνεῦμα (pneuma)', transliteration: 'pneuma', language: 'Greek', partOfSpeech: 'Noun', definition: 'Wind, breath, spirit.', usage: 'Refers to the Holy Spirit or human spirit.' },
      'H7225': { strongs: 'H7225', word: 'רֵאשִׁית (reshith)', transliteration: 'reshith', language: 'Hebrew', partOfSpeech: 'Noun', definition: 'Beginning, chief, first fruits.', usage: 'Genesis 1:1 "In the beginning".' },
      'H430': { strongs: 'H430', word: 'אֱלֹהִים (Elohim)', transliteration: 'elohim', language: 'Hebrew', partOfSpeech: 'Noun', definition: 'God, Supreme Deity.', usage: 'Creator God of Israel.' }
    };

    const readView = document.getElementById('readView');
    const aiView = document.getElementById('aiView');
    const lexiconView = document.getElementById('lexiconView');
    const navReadBtn = document.getElementById('navReadBtn');
    const navAiBtn = document.getElementById('navAiBtn');
    const navLexiconBtn = document.getElementById('navLexiconBtn');

    const testamentSelect = document.getElementById('testamentSelect');
    const bookSelect = document.getElementById('bookSelect');
    const passageRangeInput = document.getElementById('passageRangeInput');
    const loadBtn = document.getElementById('loadBtn');
    const searchInput = document.getElementById('searchInput');
    const passageTitle = document.getElementById('passageTitle');
    const verseDisplay = document.getElementById('verseDisplay');

    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const keyStatusText = document.getElementById('keyStatusText');
    const aiPassageInput = document.getElementById('aiPassageInput');
    const aiTranslationSelect = document.getElementById('aiTranslationSelect');
    const aiTraditionSelect = document.getElementById('aiTraditionSelect');
    const generateAiBtn = document.getElementById('generateAiBtn');
    const aiResultsDisplay = document.getElementById('aiResultsDisplay');

    const strongsInput = document.getElementById('strongsInput');
    const lexiconSearchBtn = document.getElementById('lexiconSearchBtn');
    const lexiconResultCard = document.getElementById('lexiconResultCard');

    document.getElementById('themeToggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    function populateBooks() {
      const selectedTestament = testamentSelect.value || 'NT';
      const books = BIBLE_BOOKS[selectedTestament];
      
      bookSelect.innerHTML = '';
      books.forEach(book => {
        const opt = document.createElement('option');
        opt.value = book;
        opt.textContent = book;
        if (book === 'Romans') opt.selected = true;
        bookSelect.appendChild(opt);
      });
    }

    testamentSelect.addEventListener('change', populateBooks);

    function switchView(activeView, activeBtn) {
      readView.classList.add('hidden');
      aiView.classList.add('hidden');
      lexiconView.classList.add('hidden');

      navReadBtn.className = "flex flex-col items-center gap-1 text-slate-400 font-bold transition-all";
      navAiBtn.className = "flex flex-col items-center gap-1 text-slate-400 font-bold transition-all";
      navLexiconBtn.className = "flex flex-col items-center gap-1 text-slate-400 font-bold transition-all";

      activeView.classList.remove('hidden');
      activeBtn.className = "flex flex-col items-center gap-1 text-sky-500 font-bold transition-all";
    }

    navReadBtn.addEventListener('click', () => switchView(readView, navReadBtn));
    navAiBtn.addEventListener('click', () => {
      switchView(aiView, navAiBtn);
      
      const currentBook = bookSelect.value || 'Romans';
      const currentRange = passageRangeInput.value.trim() || '12:9-12';
      aiPassageInput.value = `${currentBook} ${currentRange}`;
    });
    navLexiconBtn.addEventListener('click', () => switchView(lexiconView, navLexiconBtn));

    // Flexible Chapter and Verse Range Reader
    async function fetchPassage() {
      const book = bookSelect.value || 'Romans';
      const range = passageRangeInput.value.trim() || '12:9-12';
      const passageRef = `${book} ${range}`;
      
      passageTitle.textContent = `${passageRef} (ESV)`;
      verseDisplay.innerHTML = `<p class="text-xs text-slate-400 text-center py-10 animate-pulse">Loading ${passageRef} (ESV)...</p>`;

      try {
        const res = await fetch(`https://bible-api.com/${encodeURIComponent(book)}+${encodeURIComponent(range)}?translation=esv`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        
        if (data && data.verses && data.verses.length > 0) {
          verseDisplay.innerHTML = data.verses.map(v => `
            <p class="text-sm leading-relaxed text-slate-700 dark:text-slate-200">
              <sup class="text-[10px] font-extrabold text-sky-500 mr-1 select-none">${v.verse}</sup>
              <span>${v.text.trim()}</span>
            </p>
          `).join('');
        } else {
          throw new Error('No verses returned.');
        }
      } catch (err) {
        try {
          const fallbackRes = await fetch(`https://bible-api.com/${encodeURIComponent(book)}+${encodeURIComponent(range)}`);
          const fallbackData = await fallbackRes.json();
          if (fallbackData && fallbackData.verses) {
            verseDisplay.innerHTML = fallbackData.verses.map(v => `
              <p class="text-sm leading-relaxed text-slate-700 dark:text-slate-200">
                <sup class="text-[10px] font-extrabold text-sky-500 mr-1 select-none">${v.verse}</sup>
                <span>${v.text.trim()}</span>
              </p>
            `).join('');
            return;
          }
        } catch (e) {}

        verseDisplay.innerHTML = `<p class="text-xs text-rose-500 text-center py-8 font-bold">Unable to load ${passageRef}. Check range formatting (e.g., 12:9-12).</p>`;
      }
    }

    // Load Passage via Click or Enter Key
    loadBtn.addEventListener('click', fetchPassage);
    passageRangeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        fetchPassage();
      }
    });

    function lookupStrongs(id) {
      if (!id) return;
      const cleanId = id.trim().toUpperCase();
      const entry = LEXICON_DICT[cleanId] || {
        strongs: cleanId,
        word: 'Lexical Entry',
        transliteration: cleanId,
        language: cleanId.startsWith('G') ? 'Greek' : 'Hebrew',
        partOfSpeech: 'Word Root',
        definition: `Strong's definition entry for ${cleanId}.`,
        usage: 'Grammatical and biblical context entry.'
      };

      lexiconResultCard.innerHTML = `
        <div class="space-y-3">
          <div class="flex justify-between items-start border-b border-slate-200/50 dark:border-slate-800 pb-2">
            <div>
              <span class="text-[10px] font-extrabold text-sky-500 uppercase tracking-wider">${entry.language} (${entry.strongs})</span>
              <h3 class="text-xl font-bold text-slate-900 dark:text-slate-100">${entry.word}</h3>
              <p class="text-xs italic text-slate-500 dark:text-slate-400">Transliteration: ${entry.transliteration}</p>
            </div>
            <span class="text-[10px] font-bold bg-sky-500/10 text-sky-600 dark:text-sky-400 border border-sky-500/20 px-2 py-1 rounded-lg">${entry.partOfSpeech}</span>
          </div>

          <div>
            <h4 class="text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Definition</h4>
            <p class="text-xs leading-relaxed text-slate-600 dark:text-slate-300 bg-slate-100/60 dark:bg-slate-900/60 p-3 rounded-xl border border-slate-200/40 dark:border-slate-800/40">${entry.definition}</p>
          </div>

          <div>
            <h4 class="text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Usage</h4>
            <p class="text-xs leading-relaxed text-slate-600 dark:text-slate-300 bg-slate-100/60 dark:bg-slate-900/60 p-3 rounded-xl border border-slate-200/40 dark:border-slate-800/40">${entry.usage}</p>
          </div>
        </div>
      `;
    }

    lexiconSearchBtn.addEventListener('click', () => lookupStrongs(strongsInput.value));
    strongsInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        lookupStrongs(strongsInput.value);
      }
    });

    document.querySelectorAll('.preset-tag').forEach(tag => {
      tag.addEventListener('click', (e) => {
        const id = e.target.getAttribute('data-strongs');
        strongsInput.value = id;
        lookupStrongs(id);
      });
    });

    if (localStorage.getItem('gemini_key')) {
      apiKeyInput.value = localStorage.getItem('gemini_key');
      keyStatusText.textContent = 'Key active & stored in browser.';
      keyStatusText.classList.add('text-emerald-500');
    }

    saveKeyBtn.addEventListener('click', () => {
      const k = apiKeyInput.value.trim();
      if (k) {
        localStorage.setItem('gemini_key', k);
        keyStatusText.textContent = 'Key saved!';
        keyStatusText.classList.add('text-emerald-500');
      }
    });

    generateAiBtn.addEventListener('click', async () => {
      const key = (localStorage.getItem('gemini_key') || '').trim();
      if (!key) {
        aiResultsDisplay.innerHTML = `<p class="text-xs text-rose-500 text-center py-8 font-bold">Please save a Gemini API Key above first.</p>`;
        return;
      }

      const passage = aiPassageInput.value.trim();
      const translation = aiTranslationSelect.value;
      const tradition = aiTraditionSelect.value;

      aiResultsDisplay.innerHTML = `
        <div class="py-12 text-center space-y-2">
          <div class="animate-spin text-2xl inline-block">✨</div>
          <p class="text-xs text-slate-400 animate-pulse">Generating ${tradition} teaching pack for ${passage}...</p>
        </div>
      `;

      const promptText = `Provide a comprehensive study and teaching pack for ${passage} using the ${translation} translation from a ${tradition} perspective.

Return ONLY a valid JSON object matching this exact schema:
{
  "theologicalSummary": "A concise 2-3 sentence overview highlighting structural, grammatical, or theological context.",
  "sermonIllustration": "A vivid classic sermon illustration or object lesson (e.g. Francis Chan's eternity rope, Spurgeon's water pitcher, illustrative parables) tailored to the theme of this passage.",
  "conceptualAnalogy": "A clear, modern analogy explaining the central doctrine or practical point.",
  "famousQuote": "A notable quote from a theologian, C.S. Lewis, Church Father, or historical Christian author relevant to this verse (include author name).",
  "crossReferences": ["Book Ch:Vs - Brief note on connection", "Book Ch:Vs - Brief note on connection"],
  "studyQuestions": ["Question 1", "Question 2", "Question 3"]
}`;

      const requestPayload = {
        contents: [{ parts: [{ text: promptText }] }],
        generationConfig: { responseMimeType: "application/json", temperature: 0.7 }
      };

      const modelEndpoints = [
        'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',
        'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent',
        'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent'
      ];

      let lastError = null;
      let successData = null;

      for (const endpoint of modelEndpoints) {
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-goog-api-key': key
            },
            body: JSON.stringify(requestPayload)
          });

          if (res.ok) {
            successData = await res.json();
            break;
          } else {
            const errJson = await res.json().catch(() => ({}));
            lastError = errJson.error?.message || `HTTP ${res.status}`;
          }
        } catch (e) {
          lastError = e.message;
        }
      }

      if (!successData) {
        aiResultsDisplay.innerHTML = `
          <div class="text-center py-6 space-y-2">
            <p class="text-xs text-rose-500 font-bold">API Connection Error</p>
            <p class="text-[11px] text-slate-400 font-mono">${lastError}</p>
          </div>
        `;
        return;
      }

      try {
        const jsonText = successData.candidates?.[0]?.content?.parts?.[0]?.text;
        const data = JSON.parse(jsonText);

        aiResultsDisplay.innerHTML = `
          <div class="space-y-4">
            <div>
              <h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-500 mb-1">Overview (${tradition})</h3>
              <p class="text-xs leading-relaxed text-slate-700 dark:text-slate-200 bg-sky-500/10 border border-sky-500/20 p-3 rounded-xl font-medium">${data.theologicalSummary}</p>
            </div>

            <div>
              <h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-500 mb-2">🎪 Sermon Illustration / Object Lesson</h3>
              <div class="text-xs leading-relaxed text-slate-700 dark:text-slate-200 bg-slate-100/80 dark:bg-slate-900/60 p-3.5 rounded-xl border border-slate-200/50 dark:border-slate-800">
                ${data.sermonIllustration}
              </div>
            </div>

            <div>
              <h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-500 mb-2">💡 Conceptual Analogy</h3>
              <div class="text-xs leading-relaxed text-slate-700 dark:text-slate-200 bg-slate-100/80 dark:bg-slate-900/60 p-3.5 rounded-xl border border-slate-200/50 dark:border-slate-800">
                ${data.conceptualAnalogy}
              </div>
            </div>

            <div>
              <h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-500 mb-2">💬 Notable Quote</h3>
              <blockquote class="text-xs italic leading-relaxed text-slate-700 dark:text-slate-200 bg-indigo-500/10 border-l-4 border-indigo-500 p-3 rounded-r-xl">
                "${data.famousQuote}"
              </blockquote>
            </div>

            <div>
              <h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-500 mb-2">🔗 Key Cross-References</h3>
              <ul class="space-y-1.5">
                ${data.crossReferences.map(ref => `<li class="text-xs text-slate-700 dark:text-slate-200 bg-slate-100/60 dark:bg-slate-900/40 px-3 py-2 rounded-lg border border-slate-200/40 dark:border-slate-800/40 font-mono">📍 ${ref}</li>`).join('')}
              </ul>
            </div>

            <div>
              <h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-500 mb-2">❓ Reflection & Discussion Questions</h3>
              <ol class="space-y-2">
                ${data.studyQuestions.map((q, idx) => `<li class="text-xs leading-relaxed text-slate-700 dark:text-slate-200 bg-slate-100/80 dark:bg-slate-900/60 p-3 rounded-xl border border-slate-200/50 dark:border-slate-800"><strong class="text-sky-500">${idx + 1}.</strong>${q}</li>`).join('')}
              </ol>
            </div>
          </div>
        `;
      } catch (err) {
        aiResultsDisplay.innerHTML = `<p class="text-xs text-rose-500 text-center py-8">Parsing Error: ${err.message}</p>`;
      }
    });

    populateBooks();
    fetchPassage();
  </script>
</body>
</html>
